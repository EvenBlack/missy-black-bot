name: Instagram integration checks
on:
  pull_request:
    paths:
      - 'instagram_*.py'
      - 'app.py'
      - 'requirements.txt'
      - 'tests/test_instagram_webhook.py'
      - 'tests/test_instagram_photo_draft.py'
      - 'tests/test_instagram_first_post.py'
      - 'tests/test_instagram_permissions.py'
      - 'tests/test_instagram_editorial.py'
      - 'tests/test_instagram_growth_trends.py'
      - 'tests/test_instagram_login_diagnostic.py'
      - 'tests/test_instagram_menu.py'
      - '.github/workflows/instagram-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'aiohttp>=3.9,<4' 'cryptography>=43,<47' 'pytest>=8,<10' 'pytest-asyncio>=0.24,<2' 'aiogram>=3.7,<4' 'Pillow>=10,<13' 'tzdata>=2024.1'
      - name: Compile Instagram integration
        run: python -m py_compile app.py instagram_oauth.py instagram_webhook.py instagram_messaging.py instagram_media.py instagram_menu.py instagram_growth.py instagram_first_post.py instagram_permissions.py instagram_editorial.py instagram_login_diagnostic.py
      - name: Run isolated webhook tests
        run: python -m pytest -q tests/test_instagram_webhook.py tests/test_instagram_menu.py tests/test_instagram_photo_draft.py tests/test_instagram_first_post.py tests/test_instagram_permissions.py tests/test_instagram_editorial.py tests/test_instagram_growth_trends.py tests/test_instagram_login_diagnostic.py
